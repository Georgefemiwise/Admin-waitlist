<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WithDetails — Waitlist Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0A0A0A; --black-mid: #141414; --black-soft: #1C1C1C;
    --red: #C8102E; --red-dim: #8B0B1F;
    --white: #F5F3EF; --white-dim: #9A9690;
    --green: #22C55E; --amber: #F59E0B;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'DM Sans', system-ui, sans-serif;
  }
  html, body { background: var(--black); color: var(--white); font-family: var(--sans); min-height: 100dvh; }

  /* LOGIN */
  .login-screen {
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 32px 24px;
  }
  .login-box { width: 100%; max-width: 340px; text-align: center; }
  .login-box h1 { font-family: var(--serif); font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .login-box p { font-size: 13px; color: var(--white-dim); margin-bottom: 28px; }
  .login-box input {
    width: 100%; background: var(--black-mid); border: 1px solid #2A2A2A;
    color: var(--white); font-family: var(--sans); font-size: 18px; text-align: center;
    letter-spacing: 0.25em; padding: 16px; border-radius: 4px; outline: none;
    margin-bottom: 12px; transition: border-color 0.2s;
  }
  .login-box input:focus { border-color: var(--red-dim); }
  .login-box input.shake { animation: shake 0.35s ease; border-color: var(--red); }
  .login-btn {
    width: 100%; background: var(--red); color: var(--white); border: none;
    font-family: var(--sans); font-size: 13px; font-weight: 500; letter-spacing: 0.12em;
    text-transform: uppercase; padding: 16px; border-radius: 4px; cursor: pointer;
    transition: background 0.15s;
  }
  .login-btn:hover { background: #E01030; }

  /* MAIN */
  .main { display: none; padding: 0 0 60px; }
  .main.visible { display: block; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--black); border-bottom: 1px solid #1E1E1E;
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-brand { font-family: var(--serif); font-size: 16px; font-weight: 700; letter-spacing: 0.05em; }
  .topbar-brand span { color: var(--red); }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .refresh-btn {
    background: none; border: 1px solid #2A2A2A; color: var(--white-dim);
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 7px 12px; border-radius: 3px; cursor: pointer;
  }
  .refresh-btn:hover { border-color: var(--red-dim); color: var(--white); }

  /* STATS */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: #1A1A1A; border-bottom: 1px solid #1A1A1A; }
  .stat { background: var(--black-mid); padding: 20px 16px; text-align: center; }
  .stat-num { font-family: var(--serif); font-size: 32px; font-weight: 700; line-height: 1; }
  .stat-num.red { color: var(--red); }
  .stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--white-dim); margin-top: 4px; }

  /* FILTERS */
  .filters { padding: 14px 16px; display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid #1A1A1A; }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex-shrink: 0; background: var(--black-soft); border: 1px solid #2A2A2A;
    color: var(--white-dim); font-family: var(--sans); font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase; padding: 7px 14px;
    border-radius: 20px; cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .filter-btn.active { background: var(--red); border-color: var(--red); color: var(--white); }

  /* SEARCH */
  .search-wrap { padding: 12px 16px; border-bottom: 1px solid #1A1A1A; }
  .search-wrap input {
    width: 100%; background: var(--black-soft); border: 1px solid #2A2A2A;
    color: var(--white); font-family: var(--sans); font-size: 14px;
    padding: 11px 14px; border-radius: 4px; outline: none;
  }
  .search-wrap input::placeholder { color: #4A4845; }
  .search-wrap input:focus { border-color: var(--red-dim); }

  /* CARDS */
  .cards { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--black-mid); border: 1px solid #222;
    border-radius: 8px; padding: 16px; cursor: pointer;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: #3A3A3A; }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .card-name { font-size: 15px; font-weight: 500; }
  .card-time { font-size: 11px; color: var(--white-dim); margin-top: 2px; }

  .tag {
    display: inline-block; font-size: 10px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 3px; white-space: nowrap;
  }
  .tag-restore { background: rgba(239,68,68,0.15); color: #F87171; }
  .tag-protect { background: rgba(59,130,246,0.15); color: #60A5FA; }
  .tag-maintain { background: rgba(34,197,94,0.15); color: #4ADE80; }
  .tag-unsure   { background: rgba(156,163,175,0.12); color: #9CA3AF; }

  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .meta-pill {
    font-size: 11px; color: var(--white-dim); background: #1A1A1A;
    border: 1px solid #282828; padding: 4px 9px; border-radius: 3px;
  }
  .meta-pill.highlight { color: var(--white); border-color: #3A3A3A; }

  .card-whatsapp {
    display: flex; align-items: center; gap: 8px; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid #1E1E1E;
  }
  .wa-btn {
    flex: 1; background: #075E54; color: #fff; border: none;
    font-family: var(--sans); font-size: 12px; font-weight: 500;
    padding: 10px; border-radius: 4px; cursor: pointer; text-align: center;
    letter-spacing: 0.05em; text-decoration: none; display: block;
  }
  .wa-btn:hover { background: #0A7A6E; }
  .copy-btn {
    background: var(--black-soft); border: 1px solid #2A2A2A; color: var(--white-dim);
    font-family: var(--sans); font-size: 11px; padding: 10px 12px;
    border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  .copy-btn:hover { color: var(--white); border-color: #444; }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }

  /* multi-car badge */
  .multi-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(245,158,11,0.15); color: var(--amber);
    font-size: 10px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 3px;
  }

  .empty { text-align: center; padding: 60px 24px; color: var(--white-dim); font-size: 14px; }

  .loading-state { text-align: center; padding: 60px 24px; }
  .loading-state .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin: 0 3px; animation: bounce 1.2s infinite; }
  .loading-state .dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-state .dot:nth-child(3) { animation-delay: 0.4s; }

  .result-count { font-size: 11px; color: var(--white-dim); padding: 8px 16px 0; letter-spacing: 0.05em; }

  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-8px)} }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>ShineOps</h1>
    <p style="margin-bottom:6px;">Waitlist Viewer</p>
    <p>Enter your PIN to continue</p>
    <input type="password" inputmode="numeric" maxlength="6" id="pinInput" placeholder="••••••" onkeydown="if(event.key==='Enter') checkPin()">
    <button class="login-btn" onclick="checkPin()">Enter</button>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="mainApp">
  <div class="topbar">
    <div class="topbar-brand">With<span>Details</span> — Waitlist</div>
    <div class="topbar-right">
      <button class="refresh-btn" onclick="loadEntries()">↻ Refresh</button>
    </div>
  </div>

  <div class="stats" id="statsBar">
    <div class="stat"><div class="stat-num red" id="statTotal">—</div><div class="stat-label">Total Signups</div></div>
    <div class="stat"><div class="stat-num" id="statMulti">—</div><div class="stat-label">Multi-Car</div></div>
    <div class="stat"><div class="stat-num" id="statTema">—</div><div class="stat-label">Tema</div></div>
    <div class="stat"><div class="stat-num" id="statAccra">—</div><div class="stat-label">Accra</div></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('restore', this)">Deep Clean</button>
    <button class="filter-btn" onclick="setFilter('protect', this)">Protection</button>
    <button class="filter-btn" onclick="setFilter('maintain', this)">Maintain</button>
    <button class="filter-btn" onclick="setFilter('multi', this)">Multi-Car</button>
    <button class="filter-btn" onclick="setFilter('tema', this)">Tema</button>
    <button class="filter-btn" onclick="setFilter('accra', this)">Accra</button>
    <button class="filter-btn" onclick="setFilter('monthly', this)">Monthly</button>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search by name, location, number…" oninput="renderCards()">
  </div>

  <div class="result-count" id="resultCount"></div>
  <div class="cards" id="cardsContainer">
    <div class="loading-state"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
</div>

<script>
  const PIN = '404040';
  const SUPABASE_URL = 'https://wvrebwcdpyzfypescpfa.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2cmVid2NkcHl6ZnlwZXNjcGZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MzQ2NTUsImV4cCI6MjA5NjAxMDY1NX0.BsMb0T_W6Rpkk6ZAgtFX6OncY8bZ9XxKuNMpLeNRRvw';

  let allEntries = [];
  let activeFilter = 'all';

  function checkPin() {
    const val = document.getElementById('pinInput').value;
    if (val === PIN) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainApp').classList.add('visible');
      loadEntries();
    } else {
      const input = document.getElementById('pinInput');
      input.classList.add('shake');
      input.value = '';
      setTimeout(() => input.classList.remove('shake'), 400);
    }
  }

  document.getElementById('pinInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPin();
  });

  async function loadEntries() {
    document.getElementById('cardsContainer').innerHTML = '<div class="loading-state"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/waitlist?select=*&order=created_at.desc`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      allEntries = await res.json();
      updateStats();
      renderCards();
    } catch (e) {
      document.getElementById('cardsContainer').innerHTML = '<div class="empty">Failed to load. Check connection.</div>';
    }
  }

  function updateStats() {
    document.getElementById('statTotal').textContent = allEntries.length;
    document.getElementById('statMulti').textContent = allEntries.filter(e => e.vehicle_count === '2' || e.vehicle_count === '3+').length;
    document.getElementById('statTema').textContent = allEntries.filter(e => e.city === 'tema').length;
    document.getElementById('statAccra').textContent = allEntries.filter(e => e.city === 'accra').length;
  }

  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards();
  }

  function renderCards() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    let entries = allEntries;

    if (activeFilter === 'multi') entries = entries.filter(e => e.vehicle_count === '2' || e.vehicle_count === '3+');
    else if (activeFilter === 'tema') entries = entries.filter(e => e.city === 'tema');
    else if (activeFilter === 'accra') entries = entries.filter(e => e.city === 'accra');
    else if (activeFilter === 'monthly') entries = entries.filter(e => e.frequency === 'monthly' || e.frequency === 'bi-weekly');
    else if (activeFilter !== 'all') entries = entries.filter(e => e.service_interest === activeFilter);

    if (q) entries = entries.filter(e =>
      (e.full_name||'').toLowerCase().includes(q) ||
      (e.whatsapp||'').includes(q) ||
      (e.location||'').toLowerCase().includes(q)
    );

    document.getElementById('resultCount').textContent = `${entries.length} result${entries.length !== 1 ? 's' : ''}`;

    if (!entries.length) {
      document.getElementById('cardsContainer').innerHTML = '<div class="empty">No entries match this filter.</div>';
      return;
    }

    document.getElementById('cardsContainer').innerHTML = entries.map(e => cardHTML(e)).join('');
  }

  const interestLabel = { restore: 'Deep Clean', protect: 'Protection', maintain: 'Maintain', unsure: 'Not Sure' };
  const interestTag   = { restore: 'tag-restore', protect: 'tag-protect', maintain: 'tag-maintain', unsure: 'tag-unsure' };
  const freqLabel     = { 'one-off': 'One-off', 'monthly': 'Monthly', 'bi-weekly': 'Bi-weekly', 'unsure': 'Unsure' };
  const vehicleLabel  = { sedan: 'Sedan', suv: 'SUV', '4x4': '4×4 / Pickup', minivan: 'Minivan', coupe: 'Coupe' };

  function cardHTML(e) {
    const date = new Date(e.created_at);
    const timeStr = date.toLocaleDateString('en-GB', { day:'numeric', month:'short' }) + ' · ' + date.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    const waLink = `https://wa.me/${(e.whatsapp||'').replace(/\D/g,'')}`;
    const isMulti = e.vehicle_count === '2' || e.vehicle_count === '3+';
    const tagClass = interestTag[e.service_interest] || 'tag-unsure';
    const tagText  = interestLabel[e.service_interest] || e.service_interest || '—';

    return `<div class="card">
      <div class="card-top">
        <div>
          <div class="card-name">${e.full_name || '—'}${isMulti ? ` <span class="multi-badge">🚗 ${e.vehicle_count} cars</span>` : ''}</div>
          <div class="card-time">${timeStr}</div>
        </div>
        <span class="tag ${tagClass}">${tagText}</span>
      </div>
      <div class="card-meta">
        <span class="meta-pill highlight">${e.location || '—'}</span>
        <span class="meta-pill">${vehicleLabel[e.vehicle_type] || e.vehicle_type || '—'}</span>
        <span class="meta-pill">${freqLabel[e.frequency] || e.frequency || '—'}</span>
        <span class="meta-pill">via ${e.referral_source || '—'}</span>
      </div>
      <div class="card-whatsapp">
        <a class="wa-btn" href="${waLink}" target="_blank">Open WhatsApp</a>
        <button class="copy-btn" onclick="copyNumber(this, '${e.whatsapp||''}')">Copy</button>
      </div>
    </div>`;
  }

  function copyNumber(btn, num) {
    navigator.clipboard.writeText(num).then(() => {
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }
</script>
</body>
</html>
