<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiseForge — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0D0D0D;--s1:#141414;--s2:#1A1A1A;--s3:#202020;
  --border:#222;--border2:#2C2C2C;--border3:#363636;
  --text:#F0EFED;--dim:#555350;--dim2:#888480;
  --red:#C8102E;--red-bg:rgba(200,16,46,0.1);
  --amber:#F59E0B;--amber-bg:rgba(245,158,11,0.1);
  --blue:#60A5FA;--blue-bg:rgba(96,165,250,0.1);
  --green:#4ADE80;--green-bg:rgba(74,222,128,0.1);
  --purple:#A78BFA;--purple-bg:rgba(167,139,250,0.1);
  --sans:'Inter',system-ui,sans-serif;--r:10px;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased;font-size:14px}

/* ── LOGIN ── */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 24px}
.login-box{width:100%;max-width:280px;text-align:center}
.l-name{font-size:13px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;margin-bottom:4px}
.l-sub{font-size:10px;color:var(--dim2);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:48px}
.l-hint{font-size:10px;color:var(--dim2);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:20px}
.slider-track{width:100%;height:56px;background:var(--s1);border:1px solid var(--border2);border-radius:28px;position:relative;overflow:hidden;user-select:none;touch-action:none}
.slider-fill{position:absolute;left:0;top:0;height:100%;width:56px;background:var(--red);border-radius:28px;transition:none;pointer-events:none}
.slider-thumb{position:absolute;left:4px;top:4px;width:48px;height:48px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,0.4);z-index:2}
.slider-thumb:active{cursor:grabbing}
.slider-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim2);pointer-events:none;transition:opacity 0.2s;padding-left:60px}
.slider-label.hide{opacity:0}

/* ── APP ── */
.app{display:none}
.app.show{display:flex;flex-direction:column;min-height:100dvh}

/* Topbar */
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.tb-brand{font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase}
.tb-brand span{color:var(--red)}
.tb-right{display:flex;gap:6px}
.tbtn{background:var(--s1);border:1px solid var(--border2);color:var(--dim2);font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;padding:6px 10px;border-radius:7px;cursor:pointer;transition:color 0.12s,border-color 0.12s;text-decoration:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.tbtn:hover{color:var(--text);border-color:var(--border3)}
.tbtn.red{background:var(--red);border-color:var(--red);color:#fff}
.tbtn.red:hover{background:#A00D24}

/* Nav tabs */
.nav{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.nav-tab{flex:1;padding:11px 4px;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;text-align:center;color:var(--dim2);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s}
.nav-tab.on{color:var(--text);border-bottom-color:var(--red)}

/* Tab panels */
.panel{display:none;flex:1;overflow-y:auto}
.panel.on{display:block}

/* Stats strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--border);gap:1px;border-bottom:1px solid var(--border)}
.stat{background:var(--s1);padding:14px 10px;text-align:center}
.stat-n{font-size:22px;font-weight:600;line-height:1;letter-spacing:-0.01em}
.stat-n.r{color:var(--red)}.stat-n.a{color:var(--amber)}.stat-n.g{color:var(--green)}
.stat-l{font-size:9px;letter-spacing:0.09em;text-transform:uppercase;color:var(--dim);margin-top:3px}

/* Filters */
.fbar{padding:9px 12px;display:flex;gap:5px;overflow-x:auto;border-bottom:1px solid var(--border)}
.fbar::-webkit-scrollbar{display:none}
.fb{flex-shrink:0;background:none;border:1px solid var(--border2);color:var(--dim2);font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;padding:5px 10px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:all 0.12s}
.fb.on{background:var(--text);border-color:var(--text);color:var(--bg)}

/* Search */
.sbar{padding:8px 12px;border-bottom:1px solid var(--border)}
.sbar input{width:100%;background:var(--s1);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;border-radius:8px;outline:none;transition:border-color 0.15s}
.sbar input::placeholder{color:var(--dim)}
.sbar input:focus{border-color:var(--border3)}
.cbar{font-size:10px;color:var(--dim);padding:7px 12px 2px;letter-spacing:0.06em;text-transform:uppercase}

/* Cards list */
.cards{padding:8px 12px 80px;display:flex;flex-direction:column;gap:6px}

/* Waitlist card */
.wcard{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r);padding:12px;cursor:pointer;transition:border-color 0.12s}
.wcard:hover{border-color:var(--border3)}
.wc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.wc-name{font-size:14px;font-weight:500;line-height:1.2}
.wc-time{font-size:10px;color:var(--dim);margin-top:2px}
.wc-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.badge{display:inline-block;font-size:9px;font-weight:500;letter-spacing:0.07em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap}
.b-hot{background:var(--red-bg);color:var(--red)}
.b-warm{background:var(--amber-bg);color:var(--amber)}
.b-cold{background:rgba(96,165,250,0.08);color:#93C5FD}
.b-vip{background:var(--purple-bg);color:var(--purple)}
.b-biz{background:var(--amber-bg);color:var(--amber)}
.b-multi{background:var(--blue-bg);color:var(--blue)}
.b-partner{background:var(--green-bg);color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{font-size:11px;color:var(--dim2);background:var(--s2);border:1px solid var(--border);padding:2px 7px;border-radius:4px}
.chip.hi{color:var(--text);border-color:var(--border2)}

/* Partner cards */
.pcard{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r);padding:12px;cursor:pointer;transition:border-color 0.12s}
.pcard:hover{border-color:var(--border3)}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.pc-name{font-size:14px;font-weight:500}
.pc-dealer{font-size:11px;color:var(--dim2);margin-top:2px}
.pc-loc{font-size:11px;color:var(--dim);margin-top:1px}
.pc-meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.overlay.show{display:flex}
.sheet{background:var(--s1);border:1px solid var(--border2);border-radius:16px 16px 0 0;padding:20px 16px 44px;width:100%;max-width:480px;animation:sup 0.22s ease;max-height:90dvh;overflow-y:auto}
.sheet-title{font-size:14px;font-weight:600;letter-spacing:0.05em;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.sheet-close{background:none;border:none;color:var(--dim2);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
.field-group{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.field-label{font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim2);margin-bottom:4px}
.inp{width:100%;background:var(--s2);border:1px solid var(--border2);color:var(--text);font-family:var(--sans);font-size:14px;padding:11px 13px;border-radius:8px;outline:none;transition:border-color 0.15s;-webkit-appearance:none}
.inp:focus{border-color:var(--border3)}
.inp::placeholder{color:var(--dim)}
select.inp{background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%23555350' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;cursor:pointer}
select.inp option{background:var(--s2)}
.status-pills{display:flex;gap:6px;flex-wrap:wrap}
.sp{padding:7px 12px;background:var(--s2);border:1px solid var(--border2);border-radius:7px;font-size:11px;font-weight:500;color:var(--dim2);cursor:pointer;transition:all 0.12s;user-select:none}
.sp.hot.on{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.sp.warm.on{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.sp.cold.on{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.sp.vip.on{background:var(--purple-bg);border-color:var(--purple);color:var(--purple)}
.save-btn{width:100%;background:var(--red);color:#fff;border:none;font-family:var(--sans);font-size:13px;font-weight:500;padding:14px;border-radius:9px;cursor:pointer;margin-top:4px;transition:background 0.15s}
.save-btn:hover{background:#A00D24}
.save-btn.saving{opacity:0.5;pointer-events:none}
.del-btn{width:100%;background:none;border:1px solid var(--border2);color:var(--dim2);font-family:var(--sans);font-size:12px;padding:12px;border-radius:9px;cursor:pointer;margin-top:6px;transition:all 0.15s}
.del-btn:hover{border-color:var(--red);color:var(--red)}

/* Add partner FAB */
.fab{position:fixed;bottom:24px;right:16px;z-index:50;background:var(--red);color:#fff;border:none;font-family:var(--sans);font-size:13px;font-weight:500;padding:13px 18px;border-radius:30px;cursor:pointer;box-shadow:0 4px 20px rgba(200,16,46,0.35);display:none;transition:background 0.15s,transform 0.1s}
.fab:active{transform:scale(0.96)}
.fab.show{display:block}

/* Empty/loading */
.empty{text-align:center;padding:52px 24px;color:var(--dim);font-size:13px}
.empty .ei{font-size:28px;margin-bottom:10px}
.loading{text-align:center;padding:52px 24px}
.ldots{display:inline-flex;gap:5px}
.ldots span{width:5px;height:5px;border-radius:50%;background:var(--red);animation:bop 1.1s infinite}
.ldots span:nth-child(2){animation-delay:0.18s}
.ldots span:nth-child(3){animation-delay:0.36s}

@keyframes sup{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes bop{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="login-box">
    <div class="l-name">WiseForge</div>
    <div class="l-sub">Admin</div>
    <div class="l-hint">Slide to enter</div>
    <div class="slider-track" id="sliderTrack">
      <div class="slider-fill" id="sliderFill"></div>
      <div class="slider-thumb" id="sliderThumb">→</div>
      <div class="slider-label" id="sliderLabel">Slide to unlock</div>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <div class="topbar">
    <div class="tb-brand">Wise<span>Forge</span></div>
    <div class="tb-right">
      <a class="tbtn red" href="https://join-wiseforge.vercel.app" target="_blank">↗ Waitlist</a>
      <button class="tbtn" onclick="exportCSV()">↓ CSV</button>
      <button class="tbtn" onclick="reload()">↻</button>

  <!-- NAV TABS -->

    <div class="nav-tab on" onclick="switchTab('waitlist',this)">Waitlist</div>

  </div>

  <!-- WAITLIST PANEL -->
  <div class="panel on" id="panel-waitlist">
    <div class="stats">
      <div class="stat"><div class="stat-n r" id="sTot">—</div><div class="stat-l">Total</div></div>
      <div class="stat"><div class="stat-n" id="sHot">—</div><div class="stat-l">🔥 Hot</div></div>
      <div class="stat"><div class="stat-n" id="sBiz">—</div><div class="stat-l">Business</div></div>
      <div class="stat"><div class="stat-n g" id="sPartner">—</div><div class="stat-l">Referred</div></div>
    </div>
    <div class="fbar">
      <button class="fb on" onclick="wFilt('all',this)">All</button>
      <button class="fb" onclick="wFilt('hot',this)">🔥 Hot</button>
      <button class="fb" onclick="wFilt('warm',this)">☀️ Warm</button>
      <button class="fb" onclick="wFilt('cold',this)">❄️ Cold</button>
      <button class="fb" onclick="wFilt('vip',this)">👑 VIP</button>
      <button class="fb" onclick="wFilt('business',this)">Business</button>
      <button class="fb" onclick="wFilt('multi',this)">Multi-Car</button>
      <button class="fb" onclick="wFilt('tema',this)">Tema</button>
      <button class="fb" onclick="wFilt('accra',this)">Accra</button>
      <button class="fb" onclick="wFilt('partner',this)">Referred</button>
    </div>
    <div class="sbar"><input id="wq" type="text" placeholder="Search name, number, location…" oninput="renderWaitlist()"></div>
    <div class="cbar" id="wCount"></div>

  <!-- PARTNERS PANEL -->
  <div class="panel" id="panel-partners">

    <div class="cbar" id="pCount"></div>
    <div class="cards" id="pCards"><div class="loading"><div class="ldots"><span></span><span></span><span></span></div></div></div>
  </div>

</div>

<!-- FAB: Add Partner -->
<button class="fab" id="fab" onclick="openAddPartner()">+ Add Partner</button>

<!-- SHEET: Edit Waitlist Entry -->
<div class="overlay" id="wSheet" onclick="if(event.target===this)closeSheet('wSheet')">
  <div class="sheet">
    <div class="sheet-title">Edit Entry <button class="sheet-close" onclick="closeSheet('wSheet')">✕</button></div>
    <div class="field-group">
      <div class="field-label">Name</div>
      <input class="inp" id="e-name" type="text" placeholder="Full name">
    </div>
    <div class="field-group">
      <div class="field-label">WhatsApp</div>
      <input class="inp" id="e-phone" type="tel" placeholder="+233 XX XXX XXXX">
    </div>
    <div class="field-group">
      <div class="field-label">Location</div>
      <input class="inp" id="e-location" type="text" placeholder="Location">
    </div>
    <div class="field-group">
      <div class="field-label">Vehicles</div>
      <select class="inp" id="e-vehicles">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3+">3+</option>
      </select>
    </div>
    <div class="field-group">
      <div class="field-label">Status</div>
      <div class="status-pills">
        <div class="sp hot" onclick="pickStatus('hot',this)">🔥 Hot</div>
        <div class="sp warm" onclick="pickStatus('warm',this)">☀️ Warm</div>
        <div class="sp cold" onclick="pickStatus('cold',this)">❄️ Cold</div>
        <div class="sp vip" onclick="pickStatus('vip',this)">👑 VIP</div>
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Referred by partner</div>
      <select class="inp" id="e-partner">
        <option value="">None</option>
      </select>
    </div>
    <div class="field-group">
      <div class="field-label">Notes</div>
      <input class="inp" id="e-notes" type="text" placeholder="Any notes…">
    </div>
    <button class="save-btn" id="wSaveBtn" onclick="saveWaitlist()">Save Changes</button>
    <button class="del-btn" onclick="deleteEntry()">Remove from waitlist</button>
  </div>
</div>

<!-- SHEET: Add / Edit Partner -->
<div class="overlay" id="pSheet" onclick="if(event.target===this)closeSheet('pSheet')">
  <div class="sheet">
    <div class="sheet-title" id="pSheetTitle">Add Partner <button class="sheet-close" onclick="closeSheet('pSheet')">✕</button></div>
    <div class="field-group">
      <div class="field-label">Name</div>
      <input class="inp" id="p-name" type="text" placeholder="Sales rep name" autocapitalize="words">
    </div>
    <div class="field-group">
      <div class="field-label">WhatsApp</div>
      <input class="inp" id="p-phone" type="tel" placeholder="+233 XX XXX XXXX">
    </div>
    <div class="field-group">
      <div class="field-label">Dealership</div>
      <input class="inp" id="p-dealer" type="text" placeholder="e.g. Toyota Tema" autocapitalize="words">
    </div>
    <div class="field-group">
      <div class="field-label">Location</div>
      <input class="inp" id="p-loc" type="text" placeholder="e.g. Spintex Road" autocapitalize="words">
    </div>
    <div class="field-group">
      <div class="field-label">Notes</div>
      <input class="inp" id="p-notes" type="text" placeholder="Any notes…">
    </div>
    <button class="save-btn" id="pSaveBtn" onclick="savePartner()">Save Partner</button>
    <button class="del-btn" id="pDelBtn" style="display:none" onclick="deletePartner()">Remove Partner</button>
  </div>
</div>

<script>
const PIN    = '404040';
const SB_URL = 'https://wvrebwcdpyzfypescpfa.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2cmVid2NkcHl6ZnlwZXNjcGZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MzQ2NTUsImV4cCI6MjA5NjAxMDY1NX0.BsMb0T_W6Rpkk6ZAgtFX6OncY8bZ9XxKuNMpLeNRRvw';

let waitlist=[], partners=[], wFilter='all', editingWId=null, editingPId=null, editStatus='warm';

// ── SLIDER ──
(function(){
  let dragging=false, startX=0, currentX=0;
  function init(){
    const track=document.getElementById('sliderTrack');
    const thumb=document.getElementById('sliderThumb');
    const fill=document.getElementById('sliderFill');
    const label=document.getElementById('sliderLabel');
    const maxX=track.offsetWidth-thumb.offsetWidth-8;

    let unlocked=false;

    function setPos(x, skipCheck){
      x=Math.max(0,Math.min(x,maxX));
      currentX=x;
      thumb.style.left=(x+4)+'px';
      fill.style.width=(x+56)+'px';
      label.classList.toggle('hide',x>40);
      if(!skipCheck && !unlocked && x>=maxX-4) unlock();
    }

    function unlock(){
      if(unlocked) return;
      unlocked=true;
      dragging=false;
      thumb.style.transition='left 0.25s ease';
      fill.style.transition='width 0.25s ease';
      thumb.textContent='✓';
      setPos(maxX, true);
      setTimeout(()=>{
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('app').classList.add('show');
        loadAll();
      },350);
    }

    function reset(){
      if(unlocked) return;
      if(currentX<maxX-4){
        thumb.style.transition='left 0.3s ease';
        fill.style.transition='width 0.3s ease';
        setPos(0, true);
        setTimeout(()=>{thumb.style.transition='';fill.style.transition='';},320);
      }
    }

    // Mouse
    thumb.addEventListener('mousedown',e=>{dragging=true;startX=e.clientX-currentX;thumb.style.transition='';fill.style.transition='';e.preventDefault()});
    document.addEventListener('mousemove',e=>{if(!dragging)return;setPos(e.clientX-startX)});
    document.addEventListener('mouseup',()=>{if(!dragging)return;dragging=false;reset()});

    // Touch
    thumb.addEventListener('touchstart',e=>{dragging=true;startX=e.touches[0].clientX-currentX;thumb.style.transition='';fill.style.transition='';},{passive:true});
    document.addEventListener('touchmove',e=>{if(!dragging)return;setPos(e.touches[0].clientX-startX);},{passive:true});
    document.addEventListener('touchend',()=>{if(!dragging)return;dragging=false;reset()});
  }
  window.addEventListener('load',init);
})();

// ── TABS ──
function switchTab(tab,btn){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('panel-'+tab).classList.add('on');
  document.getElementById('fab').classList.toggle('show',tab==='partners');
}

// ── LOAD ──
async function loadAll(){await Promise.all([loadWaitlist(),loadPartners()])}

async function loadWaitlist(){
  document.getElementById('wCards').innerHTML=loading();
  try{
    const r=await sb('GET','waitlist?select=*&order=created_at.desc');
    waitlist=r; updateWStats(); renderWaitlist();
  }catch(e){document.getElementById('wCards').innerHTML=err()}
}

async function loadPartners(){
  document.getElementById('pCards').innerHTML=loading();
  try{
    const r=await sb('GET','partners?select=*&order=created_at.desc');
    partners=r; renderPartners(); populatePartnerSelect();
  }catch(e){document.getElementById('pCards').innerHTML=err()}
}

function reload(){loadAll()}

// ── STATS ──
function updateWStats(){
  document.getElementById('sTot').textContent=waitlist.length;
  document.getElementById('sHot').textContent=waitlist.filter(e=>e.status==='hot').length;
  document.getElementById('sBiz').textContent=waitlist.filter(e=>e.is_business).length;
  document.getElementById('sPartner').textContent=waitlist.filter(e=>e.partner_id).length;
}

// ── WAITLIST RENDER ──
function wFilt(f,btn){
  wFilter=f;
  document.querySelectorAll('#panel-waitlist .fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');renderWaitlist();
}

function renderWaitlist(){
  const q=(document.getElementById('wq').value||'').toLowerCase();
  let list=[...waitlist];
  if(wFilter==='hot')list=list.filter(e=>e.status==='hot');
  else if(wFilter==='warm')list=list.filter(e=>e.status==='warm'||!e.status);
  else if(wFilter==='cold')list=list.filter(e=>e.status==='cold');
  else if(wFilter==='vip')list=list.filter(e=>e.status==='vip');
  else if(wFilter==='business')list=list.filter(e=>e.is_business);
  else if(wFilter==='multi')list=list.filter(e=>e.vehicle_count==='2'||e.vehicle_count==='3+');
  else if(wFilter==='tema')list=list.filter(e=>e.city==='tema');
  else if(wFilter==='accra')list=list.filter(e=>e.city==='accra');
  else if(wFilter==='partner')list=list.filter(e=>e.partner_id);
  if(q)list=list.filter(e=>(e.full_name||'').toLowerCase().includes(q)||(e.whatsapp||'').includes(q)||(e.location||'').toLowerCase().includes(q)||(e.business_name||'').toLowerCase().includes(q));
  document.getElementById('wCount').textContent=`${list.length} result${list.length!==1?'s':''}`;
  if(!list.length){document.getElementById('wCards').innerHTML=empty('No entries match.');return;}
  document.getElementById('wCards').innerHTML=list.map(wCardHTML).join('');
}

const statusBadge={hot:'b-hot 🔥 Hot',warm:'b-warm ☀️ Warm',cold:'b-cold ❄️ Cold',vip:'b-vip 👑 VIP'};

function wCardHTML(e){
  const d=new Date(e.created_at);
  const t=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const s=e.status||'warm';
  const sb2=statusBadge[s]||statusBadge.warm;
  const [sc,...sl]=sb2.split(' ');
  const badges=[
    `<span class="badge ${sc}">${sl.join(' ')}</span>`,
    e.is_business?`<span class="badge b-biz">🏢</span>`:'',
    (e.vehicle_count==='2'||e.vehicle_count==='3+')?`<span class="badge b-multi">🚗 ${e.vehicle_count}</span>`:'',
    e.partner_name?`<span class="badge b-partner">via ${e.partner_name}</span>`:'',
  ].filter(Boolean).join('');
  const chips=[
    e.location?`<span class="chip hi">${e.location}</span>`:'',
    e.vehicle_count?`<span class="chip">${e.vehicle_count} car${e.vehicle_count!=='1'?'s':''}</span>`:'',
    e.is_business&&e.business_name?`<span class="chip">${e.business_name}</span>`:'',
    e.notes?`<span class="chip">${e.notes}</span>`:'',
  ].filter(Boolean).join('');
  return `<div class="wcard" onclick="openEditWaitlist('${e.id}')">
    <div class="wc-top">
      <div><div class="wc-name">${e.full_name||'—'}</div><div class="wc-time">${t}</div></div>
      <div class="wc-right">${badges}</div>
    </div>
    ${chips?`<div class="chips">${chips}</div>`:''}
  </div>`;
}

// ── EDIT WAITLIST ──
function openEditWaitlist(id){
  const e=waitlist.find(x=>x.id===id); if(!e) return;
  editingWId=id; editStatus=e.status||'warm';
  document.getElementById('e-name').value=e.full_name||'';
  document.getElementById('e-phone').value=e.whatsapp||'';
  document.getElementById('e-location').value=e.location||'';
  document.getElementById('e-vehicles').value=e.vehicle_count||'1';
  document.getElementById('e-notes').value=e.notes||'';
  // status pills
  document.querySelectorAll('.sp').forEach(p=>p.classList.remove('on'));
  const active=document.querySelector(`.sp.${editStatus}`);
  if(active) active.classList.add('on');
  // partner select
  const ps=document.getElementById('e-partner');
  ps.innerHTML='<option value="">None</option>'+partners.map(p=>`<option value="${p.id}" ${e.partner_id===p.id?'selected':''}>${p.name}${p.dealership?' — '+p.dealership:''}</option>`).join('');
  openSheet('wSheet');
}

function pickStatus(s,el){
  editStatus=s;
  document.querySelectorAll('.sp').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
}

async function saveWaitlist(){
  const btn=document.getElementById('wSaveBtn');
  btn.classList.add('saving'); btn.textContent='Saving…';
  const pSel=document.getElementById('e-partner');
  const pId=pSel.value||null;
  const pName=pId?pSel.options[pSel.selectedIndex].text.split(' — ')[0]:null;
  try{
    await sb('PATCH',`waitlist?id=eq.${editingWId}`,{
      full_name:document.getElementById('e-name').value.trim(),
      whatsapp:document.getElementById('e-phone').value.trim(),
      location:document.getElementById('e-location').value.trim(),
      vehicle_count:document.getElementById('e-vehicles').value,
      status:editStatus,
      notes:document.getElementById('e-notes').value.trim()||null,
      partner_id:pId,
      partner_name:pName
    });
    await loadWaitlist();
    closeSheet('wSheet');
  }catch(e){alert('Save failed. Try again.');}
  btn.classList.remove('saving'); btn.textContent='Save Changes';
}

async function deleteEntry(){
  if(!confirm('Remove this person from the waitlist?')) return;
  try{
    await sb('DELETE',`waitlist?id=eq.${editingWId}`);
    await loadWaitlist(); closeSheet('wSheet');
  }catch(e){alert('Delete failed.');}
}

// ── PARTNERS ──
function renderPartners(){
  const q=(document.getElementById('pq').value||'').toLowerCase();
  let list=[...partners];
  if(q) list=list.filter(p=>(p.name||'').toLowerCase().includes(q)||(p.dealership||'').toLowerCase().includes(q)||(p.whatsapp||'').includes(q));
  document.getElementById('pCount').textContent=`${list.length} partner${list.length!==1?'s':''}`;
  if(!list.length){document.getElementById('pCards').innerHTML=empty('No partners yet. Add your first one.');return;}
  document.getElementById('pCards').innerHTML=list.map(pCardHTML).join('');
}

function pCardHTML(p){
  const refs=waitlist.filter(w=>w.partner_id===p.id).length;
  return `<div class="pcard" onclick="openEditPartner('${p.id}')">
    <div class="pc-top">
      <div>
        <div class="pc-name">${p.name||'—'}</div>
        <div class="pc-dealer">${p.dealership||'No dealership'}</div>
        <div class="pc-loc">${p.location||''}</div>
      </div>
      ${refs?`<span class="badge b-partner">${refs} referral${refs!==1?'s':''}</span>`:''}
    </div>
    <div class="pc-meta">
      ${p.whatsapp?`<span class="chip hi">${p.whatsapp}</span>`:''}
      ${p.notes?`<span class="chip">${p.notes}</span>`:''}
    </div>
  </div>`;
}

function openAddPartner(){
  editingPId=null;
  document.getElementById('pSheetTitle').innerHTML='Add Partner <button class="sheet-close" onclick="closeSheet(\'pSheet\')">✕</button>';
  ['p-name','p-phone','p-dealer','p-loc','p-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('pDelBtn').style.display='none';
  document.getElementById('pSaveBtn').textContent='Save Partner';
  openSheet('pSheet');
}

function openEditPartner(id){
  const p=partners.find(x=>x.id===id); if(!p) return;
  editingPId=id;
  document.getElementById('pSheetTitle').innerHTML='Edit Partner <button class="sheet-close" onclick="closeSheet(\'pSheet\')">✕</button>';
  document.getElementById('p-name').value=p.name||'';
  document.getElementById('p-phone').value=p.whatsapp||'';
  document.getElementById('p-dealer').value=p.dealership||'';
  document.getElementById('p-loc').value=p.location||'';
  document.getElementById('p-notes').value=p.notes||'';
  document.getElementById('pDelBtn').style.display='block';
  document.getElementById('pSaveBtn').textContent='Save Changes';
  openSheet('pSheet');
}

async function savePartner(){
  const btn=document.getElementById('pSaveBtn');
  btn.classList.add('saving'); btn.textContent='Saving…';
  const body={name:document.getElementById('p-name').value.trim(),whatsapp:document.getElementById('p-phone').value.trim()||null,dealership:document.getElementById('p-dealer').value.trim()||null,location:document.getElementById('p-loc').value.trim()||null,notes:document.getElementById('p-notes').value.trim()||null};
  try{
    if(editingPId) await sb('PATCH',`partners?id=eq.${editingPId}`,body);
    else await sb('POST','partners',body);
    await loadPartners(); closeSheet('pSheet');
  }catch(e){alert('Save failed.');}
  btn.classList.remove('saving'); btn.textContent=editingPId?'Save Changes':'Save Partner';
}

async function deletePartner(){
  if(!confirm('Remove this partner?')) return;
  try{await sb('DELETE',`partners?id=eq.${editingPId}`);await loadPartners();closeSheet('pSheet');}
  catch(e){alert('Delete failed.');}
}

function populatePartnerSelect(){
  const sel=document.getElementById('e-partner');
  if(!sel) return;
  sel.innerHTML='<option value="">None</option>'+partners.map(p=>`<option value="${p.id}">${p.name}${p.dealership?' — '+p.dealership:''}</option>`).join('');
}

// ── SHEET HELPERS ──
function openSheet(id){document.getElementById(id).classList.add('show')}
function closeSheet(id){document.getElementById(id).classList.remove('show')}

// ── SUPABASE ──
async function sb(method,path,body){
  const opts={method,headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,opts);
  if(method==='GET') return r.json();
  if(!r.ok) throw new Error(await r.text());
}

// ── CSV ──
function exportCSV(){
  if(!waitlist.length) return;
  const cols=['full_name','whatsapp','city','location','vehicle_count','status','is_business','business_name','partner_name','notes','created_at'];
  const rows=[cols.join(','),...waitlist.map(e=>cols.map(c=>`"${(e[c]||'').toString().replace(/"/g,'""')}"`).join(','))];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download=`wiseforge-waitlist-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ── UTILS ──
function loading(){return'<div class="loading"><div class="ldots"><span></span><span></span><span></span></div></div>'}
function empty(msg){return`<div class="empty"><div class="ei">—</div>${msg}</div>`}
function err(){return'<div class="empty"><div class="ei">⚠️</div>Failed to load.</div>'}
