<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiseForge — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090b;
    --surface: #121214;
    --card: #18181b;
    --card-hover: #1f1f23;
    --border: #27272a;
    --border-light: #3f3f46;
    --text: #fafafa;
    --dim: #71717a;
    --dim2: #a1a1aa;
    --red: #e11d48;
    --red-soft: rgba(225, 29, 72, 0.12);
    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.12);
    --amber: #f59e0b;
    --amber-soft: rgba(245, 158, 11, 0.12);
    --blue: #3b82f6;
    --blue-soft: rgba(59, 130, 246, 0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100dvh;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── LOGIN ── */
  .login {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(225, 29, 72, 0.08), transparent),
      var(--bg);
  }
  .login-box {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .login-logo {
    margin-bottom: 40px;
  }
  .login-logo strong {
    display: block;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 6px;
  }
  .login-logo span {
    font-size: 13px;
    font-weight: 500;
    color: var(--dim);
    letter-spacing: 0.04em;
  }
  .pin-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.35em;
    text-align: center;
    padding: 18px 16px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    margin-bottom: 14px;
    -webkit-text-security: disc;
  }
  .pin-input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-soft);
  }
  .pin-input.shake {
    animation: shake 0.35s ease;
    border-color: var(--red);
  }
  .login-btn {
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    padding: 15px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .login-btn:hover { background: #be123c; }
  .login-btn:active { transform: scale(0.98); }

  /* ── APP ── */
  .app { display: none; }
  .app.show { display: block; }

  /* Top bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(9, 9, 11, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar-brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .topbar-brand span { color: var(--red); }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--dim2);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .icon-btn:hover {
    color: var(--text);
    border-color: var(--border-light);
    background: var(--card);
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 16px 18px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 14px;
    transition: border-color 0.15s;
  }
  .stat:hover { border-color: var(--border-light); }
  .stat-num {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 4px;
  }
  .stat-num.red { color: var(--red); }
  .stat-num.amber { color: var(--amber); }
  .stat-num.green { color: var(--green); }
  .stat-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--dim);
    text-transform: uppercase;
  }

  /* Filters */
  .filter-bar {
    padding: 0 18px 12px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .f-btn {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--dim2);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .f-btn:hover {
    border-color: var(--border-light);
    color: var(--text);
  }
  .f-btn.on {
    background: var(--text);
    border-color: var(--text);
    color: var(--bg);
  }

  /* Search */
  .search-bar {
    padding: 0 18px 14px;
  }
  .search-bar input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    padding: 12px 16px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-bar input::placeholder { color: var(--dim); }
  .search-bar input:focus {
    border-color: var(--border-light);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
  }

  /* Count */
  .result-count {
    font-size: 12px;
    font-weight: 500;
    color: var(--dim);
    padding: 0 18px 10px;
  }

  /* Cards */
  .cards {
    padding: 0 18px 100px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: border-color 0.15s, background 0.15s;
  }
  .card:hover {
    border-color: var(--border-light);
    background: var(--card-hover);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .card-name {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.01em;
  }
  .card-time {
    font-size: 12px;
    color: var(--dim);
    margin-top: 3px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 6px;
  }
  .badge-biz { background: var(--amber-soft); color: var(--amber); }
  .badge-multi { background: var(--blue-soft); color: var(--blue); }

  .card-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }
  .chip {
    font-size: 12px;
    font-weight: 500;
    color: var(--dim2);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
  }
  .chip.loc {
    color: var(--text);
    border-color: var(--border-light);
  }

  .card-actions {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .wa-btn {
    flex: 1;
    background: #128C7E;
    color: #fff;
    border: none;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    padding: 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
    transition: background 0.15s, transform 0.1s;
  }
  .wa-btn:hover { background: #0e7a6d; }
  .wa-btn:active { transform: scale(0.98); }
  .copy-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--dim2);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .copy-btn:hover {
    color: var(--text);
    border-color: var(--border-light);
  }
  .copy-btn.copied {
    color: var(--green);
    border-color: var(--green);
    background: var(--green-soft);
  }

  /* Empty / loading */
  .state-msg {
    text-align: center;
    padding: 64px 24px;
    color: var(--dim);
  }
  .state-msg .emoji {
    font-size: 36px;
    margin-bottom: 14px;
    opacity: 0.8;
  }
  .state-msg p {
    font-size: 14px;
    font-weight: 500;
  }

  .dots {
    display: inline-flex;
    gap: 6px;
  }
  .dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red);
    animation: bounce 1.1s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.6; }
    40% { transform: translateY(-8px); opacity: 1; }
  }

  /* Responsive */
  @media (max-width: 520px) {
    .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px 14px; }
    .stat { padding: 14px 12px; }
    .stat-num { font-size: 22px; }
    .topbar, .filter-bar, .search-bar, .result-count, .cards {
      padding-left: 14px;
      padding-right: 14px;
    }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <strong>WiseForge</strong>
      <span>Admin Dashboard</span>
    </div>
    <input type="password" class="pin-input" id="pinInput" placeholder="••••••" maxlength="6"
      inputmode="numeric" onkeydown="if(event.key==='Enter')checkPin()">
    <button class="login-btn" onclick="checkPin()">Enter</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <div class="topbar">
    <div class="topbar-brand">Wise<span>Forge</span> Waitlist</div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="exportCSV()">↓ CSV</button>
      <button class="icon-btn" onclick="loadData()">↻ Refresh</button>
    </div>
  </div>

  <div class="stats" id="statsBar">
    <div class="stat">
      <div class="stat-num red" id="sTot">—</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-num amber" id="sBiz">—</div>
      <div class="stat-label">Business</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="sTema">—</div>
      <div class="stat-label">Tema</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="sAccra">—</div>
      <div class="stat-label">Accra</div>
    </div>
  </div>

  <div class="filter-bar">
    <button class="f-btn on"  onclick="setFilter('all',this)">All</button>
    <button class="f-btn"     onclick="setFilter('business',this)">Business</button>
    <button class="f-btn"     onclick="setFilter('multi',this)">Multi-Car</button>
    <button class="f-btn"     onclick="setFilter('tema',this)">Tema</button>
    <button class="f-btn"     onclick="setFilter('accra',this)">Accra</button>
    <button class="f-btn"     onclick="setFilter('other',this)">Other</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchQ" placeholder="Search name, number, location…" oninput="render()">
  </div>

  <div class="result-count" id="countLabel"></div>
  <div class="cards" id="cards">
    <div class="state-msg"><div class="dots"><span></span><span></span><span></span></div></div>
  </div>

</div>

<script>
  const PIN    = '404040';
  const SB_URL = 'https://wvrebwcdpyzfypescpfa.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2cmVid2NkcHl6ZnlwZXNjcGZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MzQ2NTUsImV4cCI6MjA5NjAxMDY1NX0.BsMb0T_W6Rpkk6ZAgtFX6OncY8bZ9XxKuNMpLeNRRvw';

  let all = [], activeFilter = 'all';

  function checkPin() {
    const val = document.getElementById('pinInput').value;
    if (val === PIN) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('show');
      loadData();
    } else {
      const inp = document.getElementById('pinInput');
      inp.classList.add('shake'); inp.value = '';
      setTimeout(()=>inp.classList.remove('shake'), 350);
    }
  }
  document.getElementById('pinInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPin(); });

  async function loadData() {
    document.getElementById('cards').innerHTML = '<div class="state-msg"><div class="dots"><span></span><span></span><span></span></div></div>';
    try {
      const res = await fetch(`${SB_URL}/rest/v1/waitlist?select=*&order=created_at.desc`, {
        headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
      });
      all = await res.json();
      updateStats(); render();
    } catch(e) {
      document.getElementById('cards').innerHTML = '<div class="state-msg"><div class="emoji">⚠️</div><p>Failed to load. Check connection and refresh.</p></div>';
    }
  }

  function updateStats() {
    document.getElementById('sTot').textContent   = all.length;
    document.getElementById('sBiz').textContent   = all.filter(e=>e.is_business).length;
    document.getElementById('sTema').textContent  = all.filter(e=>e.city==='tema').length;
    document.getElementById('sAccra').textContent = all.filter(e=>e.city==='accra').length;
  }

  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); render();
  }

  function render() {
    const q = document.getElementById('searchQ').value.toLowerCase();
    let list = [...all];

    if (activeFilter==='business') list = list.filter(e=>e.is_business);
    else if (activeFilter==='multi') list = list.filter(e=>e.vehicle_count==='2'||e.vehicle_count==='3+');
    else if (activeFilter==='tema') list = list.filter(e=>e.city==='tema');
    else if (activeFilter==='accra') list = list.filter(e=>e.city==='accra');
    else if (activeFilter==='other') list = list.filter(e=>e.city==='other');

    if (q) list = list.filter(e =>
      (e.full_name||'').toLowerCase().includes(q) ||
      (e.whatsapp||'').includes(q) ||
      (e.location||'').toLowerCase().includes(q) ||
      (e.business_name||'').toLowerCase().includes(q)
    );

    document.getElementById('countLabel').textContent = `\( {list.length} result \){list.length!==1?'s':''}`;

    if (!list.length) {
      document.getElementById('cards').innerHTML = '<div class="state-msg"><div class="emoji">🔍</div><p>No entries match.</p></div>';
      return;
    }
    document.getElementById('cards').innerHTML = list.map(cardHTML).join('');
  }

  function cardHTML(e) {
    const d = new Date(e.created_at);
    const time = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const wa = `https://wa.me/${(e.whatsapp||'').replace(/\D/g,'')}`;
    const isMulti = e.vehicle_count==='2'||e.vehicle_count==='3+';

    const badges = [
      e.is_business ? `<span class="badge badge-biz">🏢 ${e.business_name||'Business'}</span>` : '',
      isMulti       ? `<span class="badge badge-multi">🚗 ${e.vehicle_count} cars</span>` : ''
    ].join('');

    const chips = [
      e.location    ? `<span class="chip loc">${e.location}</span>` : '',
      e.vehicle_count ? `<span class="chip">\( {e.vehicle_count} vehicle \){e.vehicle_count!=='1'?'s':''}</span>` : '',
      e.business_role ? `<span class="chip">${e.business_role}</span>` : '',
    ].filter(Boolean).join('');

    return `<div class="card">
      <div class="card-top">
        <div>
          <div class="card-name">\( {e.full_name||'—'} \){badges}</div>
          <div class="card-time">${time}</div>
        </div>
      </div>
      \( {chips ? `<div class="card-chips"> \){chips}</div>` : ''}
      <div class="card-actions">
        <a class="wa-btn" href="${wa}" target="_blank">WhatsApp</a>
        <button class="copy-btn" onclick="copyNum(this,'${e.whatsapp||''}')">Copy</button>
      </div>
    </div>`;
  }

  function copyNum(btn, num) {
    navigator.clipboard.writeText(num).then(()=>{
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function exportCSV() {
    if (!all.length) return;
    const cols = ['full_name','whatsapp','city','location','vehicle_count','is_business','business_name','business_role','created_at'];
    const rows = [cols.join(','), ...all.map(e => cols.map(c => `"${(e[c]||'').toString().replace(/"/g,'""')}"`).join(','))];
    const blob = new Blob([rows.join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `wiseforge-waitlist-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }
</script>
</body>
</html>
