<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiseForge — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0C0C0C; --surface: #141414; --card: #1A1A1A; --border: #242424;
    --text: #F0EFED; --dim: #6A6865; --dim2: #9A9690;
    --red: #C8102E; --red-dim: rgba(200,16,46,0.15);
    --green: #22C55E; --amber: #F59E0B; --blue: #3B82F6;
    --sans: 'DM Sans', system-ui, sans-serif;
  }
  html, body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100dvh; font-size: 14px; }

  /* ── LOGIN ── */
  .login {
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 32px 24px;
  }
  .login-box { width: 100%; max-width: 300px; text-align: center; }
  .login-logo { font-size: 12px; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim2); margin-bottom: 32px; }
  .login-logo strong { color: var(--text); display: block; font-size: 18px; letter-spacing: 0.15em; margin-bottom: 4px; }
  .pin-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: var(--sans); font-size: 28px; font-weight: 300;
    letter-spacing: 0.4em; text-align: center; padding: 18px; border-radius: 10px;
    outline: none; transition: border-color 0.15s; margin-bottom: 12px;
    -webkit-text-security: disc;
  }
  .pin-input:focus { border-color: var(--dim2); }
  .pin-input.shake { animation: shake 0.3s ease; border-color: var(--red); }
  .login-btn {
    width: 100%; background: var(--red); color: #fff; border: none; font-family: var(--sans);
    font-size: 13px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 15px; border-radius: 10px; cursor: pointer;
  }

  /* ── APP ── */
  .app { display: none; }
  .app.show { display: block; }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-brand { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  .topbar-brand span { color: var(--red); }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--dim2);
    font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 7px 12px; border-radius: 6px; cursor: pointer;
    transition: color 0.15s, border-color 0.15s; white-space: nowrap;
  }
  .icon-btn:hover { color: var(--text); border-color: #3A3A3A; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--border); }
  .stat { background: var(--surface); padding: 18px 16px; }
  .stat-num { font-size: 28px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
  .stat-num.red { color: var(--red); }
  .stat-num.amber { color: var(--amber); }
  .stat-num.green { color: var(--green); }
  .stat-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }

  /* Filters */
  .filter-bar { padding: 12px 14px; display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--border); }
  .filter-bar::-webkit-scrollbar { display: none; }
  .f-btn {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
    color: var(--dim2); font-family: var(--sans); font-size: 11px; font-weight: 500;
    letter-spacing: 0.07em; text-transform: uppercase; padding: 6px 12px;
    border-radius: 20px; cursor: pointer; white-space: nowrap; transition: all 0.12s;
  }
  .f-btn.on { background: var(--text); border-color: var(--text); color: var(--bg); }

  /* Search */
  .search-bar { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .search-bar input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: var(--sans); font-size: 14px;
    padding: 10px 13px; border-radius: 8px; outline: none; transition: border-color 0.15s;
  }
  .search-bar input::placeholder { color: var(--dim); }
  .search-bar input:focus { border-color: #3A3A3A; }

  /* Count */
  .result-count { font-size: 11px; color: var(--dim); padding: 10px 14px 2px; letter-spacing: 0.05em; }

  /* Cards */
  .cards { padding: 10px 14px 80px; display: flex; flex-direction: column; gap: 8px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; transition: border-color 0.12s;
  }
  .card:hover { border-color: #303030; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
  .card-name { font-size: 15px; font-weight: 500; line-height: 1.2; }
  .card-time { font-size: 11px; color: var(--dim); margin-top: 2px; }

  .badge {
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 500;
    letter-spacing: 0.07em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
    white-space: nowrap; flex-shrink: 0; margin-left: 8px;
  }
  .badge-biz { background: rgba(245,158,11,0.15); color: var(--amber); }
  .badge-multi { background: rgba(59,130,246,0.12); color: var(--blue); }

  .card-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .chip {
    font-size: 11px; color: var(--dim2); background: var(--surface);
    border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px;
  }
  .chip.loc { color: var(--text); border-color: #2E2E2E; }

  .card-actions { display: flex; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); }
  .wa-btn {
    flex: 1; background: #075E54; color: #fff; border: none; font-family: var(--sans);
    font-size: 12px; font-weight: 500; padding: 9px; border-radius: 7px; cursor: pointer;
    text-align: center; text-decoration: none; display: block; transition: background 0.15s;
  }
  .wa-btn:hover { background: #0A7A6E; }
  .copy-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--dim2);
    font-family: var(--sans); font-size: 11px; padding: 9px 12px;
    border-radius: 7px; cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .copy-btn:hover { color: var(--text); border-color: #3A3A3A; }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }

  /* Empty / loading */
  .state-msg { text-align: center; padding: 60px 24px; color: var(--dim); }
  .state-msg .emoji { font-size: 32px; margin-bottom: 12px; }

  .dots { display: inline-flex; gap: 5px; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: bounce 1.1s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-7px)} }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginScreen">
  <div class="login-box">
    <div class="login-logo"><strong>WiseForge</strong>Admin Dashboard</div>
    <input type="password" class="pin-input" id="pinInput" placeholder="••••••" maxlength="6"
      inputmode="numeric" onkeydown="if(event.key==='Enter')checkPin()">
    <button class="login-btn" onclick="checkPin()">Enter</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <div class="topbar">
    <div class="topbar-brand">Wise<span>Forge</span> Waitlist</div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="exportCSV()">↓ CSV</button>
      <button class="icon-btn" onclick="loadData()">↻</button>
    </div>
  </div>

  <div class="stats" id="statsBar">
    <div class="stat"><div class="stat-num red" id="sTot">—</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num amber" id="sBiz">—</div><div class="stat-label">Business</div></div>
    <div class="stat"><div class="stat-num" id="sTema">—</div><div class="stat-label">Tema</div></div>
    <div class="stat"><div class="stat-num" id="sAccra">—</div><div class="stat-label">Accra</div></div>
  </div>

  <div class="filter-bar">
    <button class="f-btn on"  onclick="setFilter('all',this)">All</button>
    <button class="f-btn"     onclick="setFilter('business',this)">Business</button>
    <button class="f-btn"     onclick="setFilter('multi',this)">Multi-Car</button>
    <button class="f-btn"     onclick="setFilter('tema',this)">Tema</button>
    <button class="f-btn"     onclick="setFilter('accra',this)">Accra</button>
    <button class="f-btn"     onclick="setFilter('other',this)">Other</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchQ" placeholder="Search name, number, location…" oninput="render()">
  </div>

  <div class="result-count" id="countLabel"></div>
  <div class="cards" id="cards">
    <div class="state-msg"><div class="dots"><span></span><span></span><span></span></div></div>
  </div>

</div>

<script>
  const PIN    = '404040';
  const SB_URL = 'https://wvrebwcdpyzfypescpfa.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2cmVid2NkcHl6ZnlwZXNjcGZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MzQ2NTUsImV4cCI6MjA5NjAxMDY1NX0.BsMb0T_W6Rpkk6ZAgtFX6OncY8bZ9XxKuNMpLeNRRvw';

  let all = [], activeFilter = 'all';

  function checkPin() {
    const val = document.getElementById('pinInput').value;
    if (val === PIN) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('app').classList.add('show');
      loadData();
    } else {
      const inp = document.getElementById('pinInput');
      inp.classList.add('shake'); inp.value = '';
      setTimeout(()=>inp.classList.remove('shake'), 350);
    }
  }
  document.getElementById('pinInput').addEventListener('keydown', e => { if(e.key==='Enter') checkPin(); });

  async function loadData() {
    document.getElementById('cards').innerHTML = '<div class="state-msg"><div class="dots"><span></span><span></span><span></span></div></div>';
    try {
      const res = await fetch(`${SB_URL}/rest/v1/waitlist?select=*&order=created_at.desc`, {
        headers: { 'apikey': SB_KEY, 'Authorization': `Bearer ${SB_KEY}` }
      });
      all = await res.json();
      updateStats(); render();
    } catch(e) {
      document.getElementById('cards').innerHTML = '<div class="state-msg"><div class="emoji">⚠️</div>Failed to load. Check connection and refresh.</div>';
    }
  }

  function updateStats() {
    document.getElementById('sTot').textContent   = all.length;
    document.getElementById('sBiz').textContent   = all.filter(e=>e.is_business).length;
    document.getElementById('sTema').textContent  = all.filter(e=>e.city==='tema').length;
    document.getElementById('sAccra').textContent = all.filter(e=>e.city==='accra').length;
  }

  function setFilter(f, btn) {
    activeFilter = f;
    document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on'); render();
  }

  function render() {
    const q = document.getElementById('searchQ').value.toLowerCase();
    let list = [...all];

    if (activeFilter==='business') list = list.filter(e=>e.is_business);
    else if (activeFilter==='multi') list = list.filter(e=>e.vehicle_count==='2'||e.vehicle_count==='3+');
    else if (activeFilter==='tema') list = list.filter(e=>e.city==='tema');
    else if (activeFilter==='accra') list = list.filter(e=>e.city==='accra');
    else if (activeFilter==='other') list = list.filter(e=>e.city==='other');

    if (q) list = list.filter(e =>
      (e.full_name||'').toLowerCase().includes(q) ||
      (e.whatsapp||'').includes(q) ||
      (e.location||'').toLowerCase().includes(q) ||
      (e.business_name||'').toLowerCase().includes(q)
    );

    document.getElementById('countLabel').textContent = `${list.length} result${list.length!==1?'s':''}`;

    if (!list.length) {
      document.getElementById('cards').innerHTML = '<div class="state-msg"><div class="emoji">🔍</div>No entries match.</div>';
      return;
    }
    document.getElementById('cards').innerHTML = list.map(cardHTML).join('');
  }

  function cardHTML(e) {
    const d = new Date(e.created_at);
    const time = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const wa = `https://wa.me/${(e.whatsapp||'').replace(/\D/g,'')}`;
    const isMulti = e.vehicle_count==='2'||e.vehicle_count==='3+';

    const badges = [
      e.is_business ? `<span class="badge badge-biz">🏢 ${e.business_name||'Business'}</span>` : '',
      isMulti       ? `<span class="badge badge-multi">🚗 ${e.vehicle_count} cars</span>` : ''
    ].join('');

    const chips = [
      e.location    ? `<span class="chip loc">${e.location}</span>` : '',
      e.vehicle_count ? `<span class="chip">${e.vehicle_count} vehicle${e.vehicle_count!=='1'?'s':''}</span>` : '',
      e.business_role ? `<span class="chip">${e.business_role}</span>` : '',
    ].filter(Boolean).join('');

    return `<div class="card">
      <div class="card-top">
        <div>
          <div class="card-name">${e.full_name||'—'}${badges}</div>
          <div class="card-time">${time}</div>
        </div>
      </div>
      ${chips ? `<div class="card-chips">${chips}</div>` : ''}
      <div class="card-actions">
        <a class="wa-btn" href="${wa}" target="_blank">WhatsApp</a>
        <button class="copy-btn" onclick="copyNum(this,'${e.whatsapp||''}')">Copy</button>
      </div>
    </div>`;
  }

  function copyNum(btn, num) {
    navigator.clipboard.writeText(num).then(()=>{
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function exportCSV() {
    if (!all.length) return;
    const cols = ['full_name','whatsapp','city','location','vehicle_count','is_business','business_name','business_role','created_at'];
    const rows = [cols.join(','), ...all.map(e => cols.map(c => `"${(e[c]||'').toString().replace(/"/g,'""')}"`).join(','))];
    const blob = new Blob([rows.join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `wiseforge-waitlist-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }
</script>
</body>
</html>
